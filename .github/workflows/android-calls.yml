name: Сборка Ёвари Звонки
on:
  push:
    branches: [feature/android-calls]
    paths: ['android-calls/**', '.github/workflows/android-calls.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Сборка APK
        working-directory: android-calls
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yovari-calls-apk
          path: android-calls/app/build/outputs/apk/debug/app-debug.apk
      - name: Публикация ссылки для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-calls/app/build/outputs/apk/debug/app-debug.apk yovari-zvonki.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest yovari-zvonki.apk --target "$GITHUB_SHA" --title "Ёвари Звонки (сборка ${{ github.run_number }})" --notes "Скачать yovari-zvonki.apk и установить на телефон" --prerelease
