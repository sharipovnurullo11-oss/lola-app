<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Прокат строительных инструментов</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--text:#1b1b1a;--muted:#4a4a47;--line:#d9d6cc;--accent:#1f4fa8;--ok:#17663a;--okbg:#e1f2e7;--busy:#5a4a12;--busybg:#f3eac6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--text:#f0eee7;--muted:#b8b5ab;--line:#3a3a36;--accent:#8fb3ff;--ok:#7bd9a1;--okbg:#17301f;--busy:#f0d98a;--busybg:#3a3315}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:27px;line-height:1.15;margin:0 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:var(--card);color:var(--text);margin:6px 0 14px}
.list{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;font:inherit;text-align:left;width:100%}
button.row{cursor:pointer}
.row b{display:block;font-size:17px}
.row small{color:var(--muted);font-size:14px}
.chev{color:var(--accent);font-size:22px}
.back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:6px;color:var(--accent);background:none;border:0;font:inherit;cursor:pointer;padding:0}
.tag{font-size:13px;font-weight:600;border-radius:8px;padding:4px 10px;white-space:nowrap}
.tag.free{color:var(--ok);background:var(--okbg)}
.tag.busy{color:var(--busy);background:var(--busybg)}
.note{font-size:14px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<main id="app"><p class="muted">Загрузка…</p></main>
<script>
(function () {
  var API = 'https://n8n.nurullo-sharipov.tech/webhook/prokat-public';
  var app = document.getElementById('app'), POINTS = [], CUR = '';
  var SROK = { 'коротко': 'до 3 часов', 'сутки': 'сутки', 'день': 'день', 'час': 'час' };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function call(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store', referrerPolicy: 'no-referrer' }).then(function (r) { return r.json(); });
  }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  function fail(retry) {
    clear(); app.appendChild(el('h1', '', 'Не получилось загрузить'));
    app.appendChild(el('p', 'muted', 'Проверьте интернет и попробуйте ещё раз.'));
    var b = el('button', 'row', 'Ещё раз'); b.type = 'button'; b.addEventListener('click', retry); app.appendChild(b);
  }
  function kinds(n) { var m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? 'вид инструмента' : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 'вида инструмента' : 'видов инструмента'); }
  function showList() {
    CUR = ''; clear();
    app.appendChild(el('h1', '', 'Прокат строительных инструментов'));
    app.appendChild(el('p', 'muted', 'Выберите пункт рядом с вами и посмотрите, какой инструмент есть и сколько стоит.'));
    var lab = el('label', 'muted', 'Найти пункт'); lab.setAttribute('for', 'q'); app.appendChild(lab);
    var q = el('input'); q.id = 'q'; q.type = 'search'; q.placeholder = 'Например: Корвон'; app.appendChild(q);
    var list = el('div', 'list'); app.appendChild(list);
    function draw() {
      var s = q.value.trim().toLowerCase(); while (list.firstChild) list.removeChild(list.firstChild);
      POINTS.filter(function (p) { return !s || p.name.toLowerCase().indexOf(s) >= 0; }).forEach(function (p) {
        var b = el('button', 'row'); b.type = 'button';
        var t = el('span'); t.appendChild(el('b', '', p.name)); t.appendChild(el('small', '', (p.city ? p.city + ' · ' : '') + kinds(p.kinds)));
        b.appendChild(t); b.appendChild(el('span', 'chev', '›')); b.addEventListener('click', function () { openPoint(p.name); });
        list.appendChild(b);
      });
      if (!list.firstChild) list.appendChild(el('p', 'muted', 'Такого пункта нет.'));
    }
    q.addEventListener('input', draw); draw();
  }
  function priceText(pr) { return pr.map(function (x) { return (SROK[x.srok] || x.srok) + ' — ' + x.cena + ' смн'; }).join(' · '); }
  function openPoint(name) {
    CUR = name; clear(); app.appendChild(el('p', 'muted', 'Загрузка…'));
    call({ action: 'point', name: name }).then(function (r) {
      if (CUR !== name) return;
      if (!r || !r.ok) return fail(function () { openPoint(name); });
      clear();
      var back = el('button', 'back', '‹ Все пункты'); back.type = 'button'; back.addEventListener('click', showList); app.appendChild(back);
      app.appendChild(el('h1', '', r.point.name)); app.appendChild(el('p', 'muted', r.point.city));
      var list = el('div', 'list'); app.appendChild(list);
      r.point.tools.forEach(function (t) {
        var row = el('div', 'row'); var tx = el('span'); tx.appendChild(el('b', '', t.name)); tx.appendChild(el('small', '', t.prices.length ? priceText(t.prices) : 'Цену уточняйте на пункте'));
        row.appendChild(tx); row.appendChild(el('span', 'tag ' + (t.free ? 'free' : 'busy'), t.free ? 'Есть' : 'Сейчас занят')); list.appendChild(row);
      });
      if (!r.point.tools.length) list.appendChild(el('p', 'muted', 'На этом пункте пока нет инструмента.'));
      app.appendChild(el('p', 'note', 'Наличие обновляется по записям пункта. Чтобы взять инструмент, подойдите на пункт. Оплата и залог на месте.'));
    }, function () { fail(function () { openPoint(name); }); });
  }
  call({ action: 'points' }).then(function (r) {
    if (!r || !r.ok) return fail(function () { location.reload(); });
    POINTS = r.points || []; showList();
  }, function () { fail(function () { location.reload(); }); });
})();
</script>
</body>
</html>
