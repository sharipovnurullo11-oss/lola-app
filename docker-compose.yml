services:
  app:
    build: https://github.com/sharipovnurullo11-oss/lola-app.git#main
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lola:${POSTGRES_PASSWORD}@db:5432/lola
      OWNER_EMAIL: ${OWNER_EMAIL}
    depends_on: [db]
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-root_default}
      - traefik.http.routers.lola-app.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.lola-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lola-app.tls=true
      - traefik.http.routers.lola-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}
      - traefik.http.services.lola-app.loadbalancer.server.port=3000
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lola
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [internal]
volumes:
  dbdata:
networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK:-root_default}
    external: true
