services:
  app:
    image: ghcr.io/sharipovnurullo11-oss/lola-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lola:${POSTGRES_PASSWORD}@db:5432/lola
      OWNER_EMAIL: ${OWNER_EMAIL}
      PAYMENT_DETAILS: ${PAYMENT_DETAILS:-}
      DATA_DIR: /data
    volumes: [appdata:/data]
    depends_on: [db]
    labels:
      - traefik.enable=true
      - traefik.http.routers.lola-app.rule=Host(`app.nurullo-sharipov.tech`)
      - traefik.http.routers.lola-app.entrypoints=websecure
      - traefik.http.routers.lola-app.tls=true
      - traefik.http.routers.lola-app.tls.certresolver=letsencrypt
      - traefik.http.services.lola-app.loadbalancer.server.port=3000
      - com.centurylinklabs.watchtower.enable=true
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lola
    volumes: [dbdata2:/var/lib/postgresql/data]
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    command: --label-enable --interval 60 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  dbdata2:
  appdata:
