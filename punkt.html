<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Пункт проката</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d1f23;--muted:#6b7079;--line:#e2e4e8;--accent:#4f46e5;--ok:#1f8a4c;--bad:#c0392b;--busy:#b26a00;--okbg:#e6f6ec;--busybg:#fff4dc;--badbg:#fde8e6}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--text:#eceef1;--muted:#9aa0a8;--line:#30343a;--accent:#7c74ff;--ok:#4cc483;--bad:#ff7a6b;--busy:#ffb84d;--okbg:#17301f;--busybg:#3a2d12;--badbg:#3d1c19}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 4px}
h2{font-size:21px;margin:26px 0 10px}
p{margin:8px 0}
.muted{color:var(--muted)}
.share{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:20px}
.share b{color:var(--ok);font-size:24px}
.list{display:grid;gap:10px}
.tool{border:2px solid var(--line);border-left-width:10px;border-radius:16px;background:var(--card);padding:14px 16px}
.tool.free{border-color:var(--ok);background:var(--okbg)}
.tool.out{border-color:var(--busy);background:var(--busybg)}
.tool.bad{border-color:var(--bad);background:var(--badbg)}
.tool b{display:block;font-size:20px}
.tool .st{font-weight:600;margin-top:2px}
.tool.free .st{color:var(--ok)}.tool.out .st{color:var(--busy)}.tool.bad .st{color:var(--bad)}
.tool .btn{margin-top:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.row b{display:block;font-size:19px}
.row .bad{color:var(--bad);font-weight:600}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:19px;cursor:pointer;padding:10px 16px}
.btn.sec{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:default}
.row .btn{margin-top:10px}
.err{color:var(--bad);font-weight:600}
.note{background:var(--busybg);border:1px solid var(--busy);border-radius:12px;padding:10px 12px;font-weight:600}
.empty{color:var(--muted)}
.big{font-size:20px;text-align:center;margin-top:40px}
.money{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.money div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.money div:last-child{border-bottom:0}
.money b{white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:100dvh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:22px}
label{display:block;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=tel]{display:block;width:100%;min-height:56px;font:inherit;font-size:22px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.hint{font-size:15px;color:var(--muted);margin-top:4px}
.calc{margin:14px 0;padding:12px;border-radius:12px;background:var(--bg);font-size:19px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pick .btn{min-height:52px;font-size:17px}
.pick .btn.sec.on{border-color:var(--accent);background:var(--accent);color:#fff}
.photo{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.photo.done{border-style:solid;border-color:var(--ok)}
.chk{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600}
.chk input{width:28px;height:28px;flex:none}
.two{display:grid;gap:10px;margin-top:16px}
</style>
</head>
<body>
<main id="app"><p class="big">Загрузка…</p></main>
<script>
(function () {
  'use strict';
  // Окно владельца пункта проката. Доступ — только по личной ссылке …/punkt#t=ТОКЕН.
  // Токен сразу убираем из адресной строки и держим только в памяти страницы: не сохраняем, не печатаем.
  var API = 'https://n8n-ny7q.srv2033023.hstgr.cloud/webhook/prokat-owner';
  var TOKEN = '';
  (function () {
    var m = /(?:^#|&)t=([^&]+)/.exec(location.hash || '');
    if (m) { try { TOKEN = decodeURIComponent(m[1]); } catch (e) { TOKEN = ''; } }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  })();

  var D = null, BAD = '', LOAD_ERR = '', SHEET = null;
  var app = document.getElementById('app');
  var MAX_PHOTO = 1.5 * 1024 * 1024;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function parseSum(s) { return parseFloat(String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.')); }
  function money(x) { var c = Math.round(num(x) * 100), neg = c < 0; c = Math.abs(c); var s = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+$)/g, ' '), r = c % 100; return (neg ? '−' : '') + s + (r ? ',' + ('0' + r).slice(-2) : ''); }
  function oid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function day(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? m[3] + '.' + m[2] + '.' + m[1] : String(s || ''); }
  function daysWord(n) { n = Math.abs(n) % 100; var k = n % 10; return n > 10 && n < 20 ? 'дней' : k === 1 ? 'день' : k >= 2 && k <= 4 ? 'дня' : 'дней'; }

  function api(action, extra) {
    var body = { token: TOKEN, action: action };
    for (var k in extra) body[k] = extra[k];
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json(); })
      .then(function (j) { return j && typeof j === 'object' ? j : { ok: false, error: 'Сервер ответил непонятно. Попробуйте ещё раз.' }; },
            function () { return { ok: false, net: true, error: 'Нет связи. Проверьте интернет и попробуйте ещё раз.' }; });
  }
  // Ответ сервера: при «ссылка не подходит» вся страница показывает одно сообщение.
  function take(r) {
    if (r && r.ok) { D = r; LOAD_ERR = ''; return true; }
    if (r && r.error === 'ссылка не подходит') { BAD = 'Ссылка недействительна, позвоните Нурулло'; SHEET = null; }
    return false;
  }
  function load() {
    api('me', {}).then(function (r) { if (!take(r)) LOAD_ERR = r.error || 'Не получилось загрузить'; render(); });
  }

  // Фото: сжимаем на телефоне через canvas до ширины ~900px и качества ~0.6, чтобы уложиться в 1,5 МБ.
  function shrink(file) {
    return new Promise(function (ok, fail) {
      if (!file || !/^image\//.test(file.type || 'image/')) return fail(new Error('Это не фото'));
      var fr = new FileReader();
      fr.onerror = function () { fail(new Error('Не получилось открыть фото')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { fail(new Error('Не получилось открыть фото. Сделайте снимок ещё раз.')); };
        img.onload = function () {
          var tries = [[900, 0.6], [800, 0.5], [700, 0.45], [600, 0.4]];
          for (var i = 0; i < tries.length; i++) {
            var w = Math.min(tries[i][0], img.naturalWidth || img.width), h = Math.round((img.naturalHeight || img.height) * w / (img.naturalWidth || img.width));
            var c = document.createElement('canvas'); c.width = w; c.height = h;
            var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
            var url = c.toDataURL('image/jpeg', tries[i][1]);
            if (/^data:image\/jpeg;base64,/.test(url) && url.length * 3 / 4 < MAX_PHOTO) return ok(url);
          }
          fail(new Error('Фото слишком большое. Сделайте снимок ещё раз.'));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // Цвет карточки: красный — последний возврат «поврежден», зелёный — есть свободные, жёлтый — всё в аренде.
  function lastCheck(name, rs) {
    var back = rs.filter(function (x) { return x.tool === name && x.status !== 'в аренде'; });
    back.sort(function (a, b) { return String(b.returned || b.start || '').localeCompare(String(a.returned || a.start || '')); });
    return back.length ? back[0].check : '';
  }
  function render() {
    if (BAD) { app.innerHTML = '<p class="big err">' + esc(BAD) + '</p>'; return; }
    if (!D) {
      app.innerHTML = LOAD_ERR ? '<p class="big err">' + esc(LOAD_ERR) + '</p><button type="button" class="btn sec" data-a="reload">Ещё раз</button>' : '<p class="big">Загрузка…</p>';
      return;
    }
    var pt = D.point || {}, tools = Array.isArray(D.tools) ? D.tools : [], rs = Array.isArray(D.rentals) ? D.rentals : [];
    var now = rs.filter(function (x) { return x.status === 'в аренде'; });
    var hist = rs.filter(function (x) { return x.status !== 'в аренде'; }).sort(function (a, b) { return String(b.returned || b.start || '').localeCompare(String(a.returned || a.start || '')); }).slice(0, 20);
    var h = '<h1>' + esc(pt.name || 'Пункт проката') + '</h1>' + (pt.owner ? '<p class="muted">' + esc(pt.owner) + '</p>' : '') +
      '<div class="share">Ваша доля (20%): <b>' + money(D.earned) + '</b> сомони</div>' +
      (LOAD_ERR ? '<p class="err">' + esc(LOAD_ERR) + '</p>' : '');

    h += '<h2>Инструменты</h2>';
    h += tools.length ? '<div class="list">' + tools.map(function (t, i) {
      var free = num(t.free), qty = num(t.qty), out = num(t.out), broken = lastCheck(t.name, rs) === 'поврежден';
      var cls = broken ? 'bad' : free > 0 ? 'free' : 'out';
      var st = broken ? 'Последний возврат: повреждён' : free > 0 ? (out > 0 ? 'Свободен, ещё ' + out + ' в аренде' : 'Свободен') : 'В аренде';
      return '<div class="tool ' + cls + '"><b>' + esc(t.name) + '</b>свободно ' + esc(free) + ' из ' + esc(qty) +
        '<div class="st">' + esc(st) + '</div>' +
        (free > 0 ? '<button type="button" class="btn" data-a="tool" data-i="' + i + '">Дать в аренду</button>' : '') + '</div>';
    }).join('') + '</div>' : '<p class="empty">Инструментов пока нет.</p>';

    h += '<h2>Сейчас в аренде</h2>';
    h += now.length ? '<div class="list">' + now.map(function (x) {
      return '<div class="row"><b>' + esc(x.tool) + '</b>' +
        'с ' + esc(day(x.start)) + ', ' + esc(num(x.days)) + ' ' + daysWord(num(x.days)) +
        (x.price_day != null ? ' × ' + money(x.price_day) : '') + ' = ' + money(x.amount) + ' сомони<br>' +
        'залог: ' + esc(x.deposit === 'деньги' ? 'деньги ' + money(x.deposit_sum) + ' сомони' : (x.deposit || '—')) +
        (x.phone ? '<br>тел.: ' + esc(x.phone) : '') +
        '<button type="button" class="btn ok" data-a="ret" data-id="' + esc(x.id) + '">Вернули</button></div>';
    }).join('') + '</div>' : '<p class="empty">Сейчас ничего не в аренде.</p>';

    h += '<h2>История</h2>';
    h += hist.length ? '<div class="list">' + hist.map(function (x) {
      var bad = x.check === 'поврежден';
      return '<div class="row"><b>' + esc(x.tool) + '</b>' +
        esc(day(x.start)) + (x.returned ? ' — вернули ' + esc(day(x.returned)) : '') + ', ' + esc(num(x.days)) + ' ' + daysWord(num(x.days)) + '<br>' +
        'взяли ' + money(x.amount) + ' сомони · ваша доля ' + money(x.share) + ' сомони' +
        (x.check ? '<br>' + (bad ? '<span class="bad">повреждён' + (num(x.repair_paid) > 0 ? ', за ремонт ' + money(x.repair_paid) + ' сомони' : '') + '</span>' : 'работает') : '') + '</div>';
    }).join('') + '</div>' : '<p class="empty">Пока пусто.</p>';

    var got = rs.reduce(function (s, x) { return s + Math.round(num(x.amount) * 100); }, 0) / 100, mine = num(D.earned);
    h += '<h2>Мои деньги</h2><div class="money">' +
      '<div><span>Всего собрано</span><b>' + money(got) + ' сомони</b></div>' +
      '<div><span>Моя доля 20%</span><b>' + money(mine) + ' сомони</b></div>' +
      '<div><span>К отдаче Нурулло 80%</span><b>' + money(got - mine) + ' сомони</b></div></div>';

    if (SHEET) h += SHEET.kind === 'rent' ? rentSheet() : retSheet();
    app.innerHTML = h;
  }

  function photoField(key, label, url, busy) {
    return '<label class="photo' + (url ? ' done' : '') + '">' + (url ? '<img src="' + esc(url) + '" alt="">' : '📷') + '<span>' + esc(busy ? 'Обрабатываю фото…' : url ? label + ': готово, нажмите, чтобы переснять' : label) + '</span>' +
      '<input type="file" accept="image/*" capture="environment" data-photo="' + key + '"></label>';
  }
  function total(S) { var p = parseSum(S.price), d = parseInt(S.days, 10); return p > 0 && d > 0 ? Math.round(p * 100) * d / 100 : 0; }
  function totalText(S) { var t = total(S); return 'Итого: ' + money(t) + ' сомони · ваша доля 20%: ' + money(Math.round(t * 20) / 100); }
  function rentSheet() {
    var S = SHEET, t = S.tool;
    return '<div class="ov" data-a="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Дать в аренду">' +
      '<h3>' + esc(t.name) + '</h3>' +
      '<label for="f-price">Цена за день (сомони)</label><input id="f-price" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.price) + '">' +
      (num(t.min_day) > 0 ? '<div class="hint">Не меньше ' + money(t.min_day) + ' сомони в день' + (num(t.min_hour) > 0 ? ' (за час — от ' + money(t.min_hour) + ')' : '') + '</div>' : '') +
      '<label for="f-days">На сколько дней</label><input id="f-days" type="text" inputmode="numeric" autocomplete="off" value="' + esc(S.days) + '">' +
      '<div class="calc" id="f-total">' + esc(totalText(S)) + '</div>' +
      '<label>Залог</label><div class="pick">' +
        '<button type="button" class="btn sec' + (S.zalog === 'паспорт' ? ' on' : '') + '" data-a="zalog" data-v="паспорт">Паспорт</button>' +
        '<button type="button" class="btn sec' + (S.zalog === 'деньги' ? ' on' : '') + '" data-a="zalog" data-v="деньги">Деньги</button></div>' +
      (S.zalog === 'деньги' ? '<label for="f-zsum">Сумма залога (сомони)</label><input id="f-zsum" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.zsum) + '">' : '') +
      '<label for="f-phone">Телефон арендатора</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="off" value="' + esc(S.phone) + '">' +
      '<label>Фото человека</label>' + photoField('person', 'Сфотографировать человека', S.person, S.wait.person) +
      (S.zalog === 'паспорт' ? '<label>Фото паспорта</label>' + photoField('passport', 'Сфотографировать паспорт', S.passport, S.wait.passport) : '') +
      '<label class="chk"><input type="checkbox" id="f-consent"' + (S.consent ? ' checked' : '') + '>Арендатор согласен на фото</label>' +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') +
      '<div class="two"><button type="button" class="btn" data-a="send-rent"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Отправляю…' : 'Дать в аренду') + '</button>' +
      '<button type="button" class="btn sec" data-a="close"' + (S.busy ? ' disabled' : '') + '>Отмена</button></div></div></div>';
  }
  function retSheet() {
    var S = SHEET, r = S.rental;
    return '<div class="ov" data-a="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Вернули">' +
      '<h3>Вернули: ' + esc(r.tool) + '</h3>' +
      (r.deposit === 'деньги' ? '<p class="note">Верните залог ' + money(r.deposit_sum) + ' сомони после оплаты.</p>' : '') +
      '<label>Проверка</label><div class="pick">' +
        '<button type="button" class="btn sec' + (S.check === 'работает' ? ' on' : '') + '" data-a="check" data-v="работает">Включил, работает</button>' +
        '<button type="button" class="btn sec' + (S.check === 'поврежден' ? ' on' : '') + '" data-a="check" data-v="поврежден">Повреждён</button></div>' +
      (S.check === 'поврежден' ? '<label for="f-repair">Сколько заплатили за ремонт (сомони)</label><input id="f-repair" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.repair) + '">' : '') +
      '<label>Фото инструмента</label>' + photoField('photo', 'Сфотографировать инструмент', S.photo, S.wait.photo) +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') +
      '<div class="two"><button type="button" class="btn ok" data-a="send-ret"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Отправляю…' : 'Вернули') + '</button>' +
      '<button type="button" class="btn sec" data-a="close"' + (S.busy ? ' disabled' : '') + '>Отмена</button></div></div></div>';
  }
  // Перед перерисовкой забираем то, что человек уже ввёл.
  function keep() {
    if (!SHEET) return;
    var map = { 'f-price': 'price', 'f-days': 'days', 'f-zsum': 'zsum', 'f-phone': 'phone', 'f-repair': 'repair' };
    for (var id in map) { var f = document.getElementById(id); if (f) SHEET[map[id]] = f.value; }
    var c = document.getElementById('f-consent'); if (c) SHEET.consent = c.checked;
  }
  function fail(S, text) { S.err = text; render(); var e = app.querySelector('.sheet .err'); if (e && e.scrollIntoView) e.scrollIntoView({ block: 'center' }); }

  function sendRent() {
    var S = SHEET; if (!S || S.kind !== 'rent' || S.busy) return;
    keep();
    var t = S.tool, price = parseSum(S.price), days = String(S.days).replace(/\s/g, ''), zsum = parseSum(S.zsum), phone = String(S.phone || '').trim();
    if (!(price > 0)) return fail(S, 'Напишите цену за день');
    if (num(t.min_day) > 0 && price < num(t.min_day)) return fail(S, 'Цена ниже минимума: не меньше ' + money(t.min_day) + ' сомони в день');
    if (!/^\d{1,3}$/.test(days) || +days < 1 || +days > 365) return fail(S, 'Напишите число дней от 1 до 365');
    if (S.zalog !== 'паспорт' && S.zalog !== 'деньги') return fail(S, 'Выберите залог: паспорт или деньги');
    if (S.zalog === 'деньги' && !(zsum > 0)) return fail(S, 'Напишите сумму залога');
    if (phone.replace(/\D/g, '').length < 9) return fail(S, 'Напишите телефон арендатора');
    if (S.wait.person || S.wait.passport) return fail(S, 'Подождите, фото ещё обрабатывается');
    if (!S.person) return fail(S, 'Сфотографируйте человека');
    if (S.zalog === 'паспорт' && !S.passport) return fail(S, 'Сфотографируйте паспорт');
    if (!S.consent) return fail(S, 'Отметьте: арендатор согласен на фото');
    var body = { id: S.id, tool: t.name, days: +days, price: Math.round(price * 100) / 100, zalog: S.zalog, phone: phone.slice(0, 40), consent: true, photo_person: S.person };
    if (S.zalog === 'деньги') body.zalog_sum = Math.round(zsum * 100) / 100;
    else body.photo_passport = S.passport;
    S.busy = true; S.err = ''; render();
    // id создан один раз при открытии формы: повтор после обрыва связи не создаст вторую аренду.
    api('rent', body).then(function (r) {
      if (SHEET !== S) return;
      S.busy = false;
      if (take(r)) { SHEET = null; return render(); }
      if (BAD) return render();
      if (!r.net) S.id = oid(); // сервер отказал — следующая попытка будет новой арендой
      fail(S, r.error || 'Не получилось сохранить');
    });
  }
  function sendRet() {
    var S = SHEET; if (!S || S.kind !== 'ret' || S.busy) return;
    keep();
    var repair = parseSum(S.repair);
    if (S.check !== 'работает' && S.check !== 'поврежден') return fail(S, 'Отметьте: работает или повреждён');
    if (S.check === 'поврежден' && !(repair >= 0)) return fail(S, 'Напишите, сколько заплатили за ремонт (если ничего — 0)');
    if (S.wait.photo) return fail(S, 'Подождите, фото ещё обрабатывается');
    if (!S.photo) return fail(S, 'Без фото нельзя: сфотографируйте инструмент');
    var body = { id: S.rental.id, check: S.check, photo: S.photo };
    if (S.check === 'поврежден') body.repair_pay = Math.round(repair * 100) / 100;
    S.busy = true; S.err = ''; render();
    api('return', body).then(function (r) {
      if (SHEET !== S) return;
      S.busy = false;
      if (take(r)) { SHEET = null; return render(); }
      if (BAD) return render();
      fail(S, r.error || 'Не получилось сохранить');
    });
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'ov') { if (e.target === b && SHEET && !SHEET.busy) { SHEET = null; render(); } return; }
    if (a === 'reload') { LOAD_ERR = ''; render(); return load(); }
    if (a === 'tool') {
      var t = D && D.tools && D.tools[+b.getAttribute('data-i')]; if (!t || !(num(t.free) > 0)) return;
      SHEET = { kind: 'rent', tool: t, price: '', days: '', zalog: '', zsum: '', phone: '', person: '', passport: '', consent: false, wait: {}, err: '', busy: false, id: oid() }; LOAD_ERR = ''; render();
      var f = document.getElementById('f-price'); if (f) f.focus(); return;
    }
    if (a === 'ret') {
      var id = b.getAttribute('data-id'), r = D && (D.rentals || []).filter(function (x) { return x.id === id; })[0]; if (!r) return;
      SHEET = { kind: 'ret', rental: r, check: '', repair: '', photo: '', wait: {}, err: '', busy: false }; LOAD_ERR = ''; render(); return;
    }
    if (a === 'close') { if (SHEET && !SHEET.busy) { SHEET = null; render(); } return; }
    if (!SHEET || SHEET.busy) return;
    if (a === 'zalog') { keep(); SHEET.zalog = b.getAttribute('data-v'); SHEET.err = ''; return render(); }
    if (a === 'check') { keep(); SHEET.check = b.getAttribute('data-v'); SHEET.err = ''; return render(); }
    if (a === 'send-rent') return sendRent();
    if (a === 'send-ret') return sendRet();
  });
  app.addEventListener('input', function (e) {
    if (!SHEET || SHEET.kind !== 'rent') return;
    if (e.target.id === 'f-price' || e.target.id === 'f-days') { keep(); var c = document.getElementById('f-total'); if (c) c.textContent = totalText(SHEET); }
  });
  app.addEventListener('change', function (e) {
    var key = e.target && e.target.getAttribute && e.target.getAttribute('data-photo'); if (!key || !SHEET) return;
    var S = SHEET, file = e.target.files && e.target.files[0]; if (!file) return;
    keep(); S.wait[key] = true; S.err = ''; render();
    shrink(file).then(function (url) { S[key] = url; }, function (er) { S.err = er.message; }).then(function () { S.wait[key] = false; if (SHEET === S) { keep(); render(); } });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && SHEET && !SHEET.busy) { SHEET = null; render(); } });

  if (!TOKEN) { BAD = 'Ссылка недействительна, позвоните Нурулло'; render(); } else load();
})();
</script>
</body>
</html>
