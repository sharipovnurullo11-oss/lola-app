<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Пункт проката</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1d1f23;--muted:#6b7079;--line:#e2e4e8;--accent:#4f46e5;--ok:#1f8a4c;--bad:#c0392b;--busy:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--text:#eceef1;--muted:#9aa0a8;--line:#30343a;--accent:#7c74ff;--ok:#4cc483;--bad:#ff7a6b;--busy:#ffb84d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 4px}
h2{font-size:21px;margin:26px 0 10px}
p{margin:8px 0}
.muted{color:var(--muted)}
.share{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:20px}
.share b{color:var(--ok);font-size:24px}
.list{display:grid;gap:10px}
.tool{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.tool:disabled{cursor:default;opacity:.75}
.tool .nm{flex:1;min-width:0}
.tool .nm b{display:block;font-size:19px}
.tool .go{flex:none;font-size:15px;font-weight:700;color:#fff;background:var(--accent);border-radius:12px;padding:8px 12px}
.tag{display:inline-block;font-size:14px;font-weight:600;color:var(--busy);border:1px solid var(--busy);border-radius:10px;padding:1px 8px;margin-top:4px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.row b{display:block;font-size:19px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:19px;cursor:pointer;padding:10px 16px}
.btn.sec{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:default}
.row .btn{margin-top:10px}
.err{color:var(--bad);font-weight:600}
.empty{color:var(--muted)}
.big{font-size:20px;text-align:center;margin-top:40px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:100dvh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:22px}
label{display:block;margin:12px 0 4px;font-weight:600}
input{display:block;width:100%;min-height:56px;font:inherit;font-size:22px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.calc{margin:14px 0;padding:12px;border-radius:12px;background:var(--bg);font-size:18px}
.two{display:grid;gap:10px;margin-top:14px}
</style>
</head>
<body>
<main id="app"><p class="big">Загрузка…</p></main>
<script>
(function () {
  'use strict';
  // Окно владельца пункта проката. Доступ — только по личной ссылке …/punkt#t=ТОКЕН.
  // Токен сразу убираем из адресной строки и держим только в памяти страницы: не сохраняем, не печатаем.
  var API = 'https://n8n-ny7q.srv2033023.hstgr.cloud/webhook/prokat-owner';
  var TOKEN = '';
  (function () {
    var m = /(?:^#|&)t=([^&]+)/.exec(location.hash || '');
    if (m) { try { TOKEN = decodeURIComponent(m[1]); } catch (e) { TOKEN = ''; } }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  })();

  var D = null, BAD = '', LOAD_ERR = '', SHEET = null, RET = {};
  var app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function money(x) { var c = Math.round(num(x) * 100), neg = c < 0; c = Math.abs(c); var s = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+$)/g, ' '), r = c % 100; return (neg ? '−' : '') + s + (r ? ',' + ('0' + r).slice(-2) : ''); }
  function oid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function day(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? m[3] + '.' + m[2] + '.' + m[1] : String(s || ''); }
  function daysWord(n) { n = Math.abs(n) % 100; var k = n % 10; return n > 10 && n < 20 ? 'дней' : k === 1 ? 'день' : k >= 2 && k <= 4 ? 'дня' : 'дней'; }

  function api(action, extra) {
    var body = { token: TOKEN, action: action };
    for (var k in extra) body[k] = extra[k];
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json(); })
      .then(function (j) { return j && typeof j === 'object' ? j : { ok: false, error: 'Сервер ответил непонятно. Попробуйте ещё раз.' }; },
            function () { return { ok: false, net: true, error: 'Нет связи. Проверьте интернет и попробуйте ещё раз.' }; });
  }
  // Ответ сервера: при «ссылка не подходит» вся страница показывает одно сообщение.
  function take(r) {
    if (r && r.ok) { D = r; LOAD_ERR = ''; return true; }
    if (r && r.error === 'ссылка не подходит') { BAD = 'Ссылка недействительна, позвоните Нурулло'; SHEET = null; }
    return false;
  }

  function load() {
    api('me', {}).then(function (r) { if (!take(r)) LOAD_ERR = r.error || 'Не получилось загрузить'; render(); });
  }

  function render() {
    if (BAD) { app.innerHTML = '<p class="big err">' + esc(BAD) + '</p>'; return; }
    if (!D) {
      app.innerHTML = LOAD_ERR ? '<p class="big err">' + esc(LOAD_ERR) + '</p><button type="button" class="btn sec" data-a="reload">Ещё раз</button>' : '<p class="big">Загрузка…</p>';
      return;
    }
    var pt = D.point || {}, tools = Array.isArray(D.tools) ? D.tools : [], rs = Array.isArray(D.rentals) ? D.rentals : [];
    var now = rs.filter(function (x) { return x.status === 'в аренде'; });
    var hist = rs.filter(function (x) { return x.status !== 'в аренде'; }).sort(function (a, b) { return String(b.returned || b.start || '').localeCompare(String(a.returned || a.start || '')); }).slice(0, 20);
    var h = '<h1>' + esc(pt.name || 'Пункт проката') + '</h1>' + (pt.owner ? '<p class="muted">' + esc(pt.owner) + '</p>' : '') +
      '<div class="share">Ваша доля (20%): <b>' + money(D.earned) + '</b> сомони</div>' +
      (LOAD_ERR ? '<p class="err">' + esc(LOAD_ERR) + '</p>' : '');

    h += '<h2>Инструменты</h2>';
    h += tools.length ? '<div class="list">' + tools.map(function (t, i) {
      var free = num(t.free), qty = num(t.qty), out = num(t.out);
      return '<button type="button" class="tool" data-a="tool" data-i="' + i + '"' + (free > 0 ? '' : ' disabled') + '>' +
        '<span class="nm"><b>' + esc(t.name) + '</b>свободно ' + esc(free) + ' из ' + esc(qty) + (out > 0 ? '<br><span class="tag">в аренде' + (qty > 1 ? ': ' + esc(out) : '') + '</span>' : '') + '</span>' +
        (free > 0 ? '<span class="go">Дать</span>' : '') + '</button>';
    }).join('') + '</div>' : '<p class="empty">Инструментов пока нет.</p>';

    h += '<h2>Сейчас в аренде</h2>';
    h += now.length ? '<div class="list">' + now.map(function (x) {
      var busy = !!RET[x.id];
      return '<div class="row"><b>' + esc(x.tool) + '</b>' +
        'с ' + esc(day(x.start)) + ', ' + esc(num(x.days)) + ' ' + daysWord(num(x.days)) + '<br>' +
        'взяли ' + money(x.amount) + ' сомони · ваша доля ' + money(x.share) + ' сомони' +
        '<button type="button" class="btn ok" data-a="ret" data-id="' + esc(x.id) + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Сохраняю…' : 'Вернули') + '</button></div>';
    }).join('') + '</div>' : '<p class="empty">Сейчас ничего не в аренде.</p>';

    h += '<h2>История</h2>';
    h += hist.length ? '<div class="list">' + hist.map(function (x) {
      return '<div class="row"><b>' + esc(x.tool) + '</b>' +
        esc(day(x.start)) + (x.returned ? ' — вернули ' + esc(day(x.returned)) : '') + ', ' + esc(num(x.days)) + ' ' + daysWord(num(x.days)) + '<br>' +
        'взяли ' + money(x.amount) + ' сомони · ваша доля ' + money(x.share) + ' сомони</div>';
    }).join('') + '</div>' : '<p class="empty">Пока пусто.</p>';

    if (SHEET) h += sheet();
    app.innerHTML = h;
  }

  function split(amount) { var a = Math.round(num(amount) * 100), you = Math.round(a * 0.2); return { you: you / 100, him: (a - you) / 100 }; }
  function calcText(raw) {
    var a = parseFloat(String(raw || '').replace(/\s/g, '').replace(',', '.'));
    if (!(a > 0)) return 'Вам 20%: 0, Нурулло 80%: 0';
    var s = split(a); return 'Вам 20%: ' + money(s.you) + ', Нурулло 80%: ' + money(s.him);
  }
  function sheet() {
    var S = SHEET;
    return '<div class="ov" data-a="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Дать в аренду">' +
      '<h3>' + esc(S.tool) + '</h3>' +
      '<label for="pk-days">На сколько дней</label><input id="pk-days" type="text" inputmode="numeric" autocomplete="off" value="' + esc(S.days) + '">' +
      '<label for="pk-sum">Сколько взяли за аренду (сомони)</label><input id="pk-sum" type="text" inputmode="decimal" autocomplete="off" value="' + esc(S.sum) + '">' +
      '<div class="calc" id="pk-calc">' + esc(calcText(S.sum)) + '</div>' +
      (S.err ? '<p class="err">' + esc(S.err) + '</p>' : '') +
      '<div class="two"><button type="button" class="btn" data-a="rent"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Сохраняю…' : 'Дать в аренду') + '</button>' +
      '<button type="button" class="btn sec" data-a="close"' + (S.busy ? ' disabled' : '') + '>Отмена</button></div></div></div>';
  }
  function keep() { if (!SHEET) return; var d = document.getElementById('pk-days'), s = document.getElementById('pk-sum'); if (d) SHEET.days = d.value; if (s) SHEET.sum = s.value; }

  function rent() {
    var S = SHEET; if (!S || S.busy) return;
    keep();
    var days = String(S.days).replace(/\s/g, ''), amount = parseFloat(String(S.sum).replace(/\s/g, '').replace(',', '.'));
    if (!/^\d{1,3}$/.test(days) || +days < 1 || +days > 365) { S.err = 'Напишите число дней от 1 до 365'; return render(); }
    if (!(amount > 0)) { S.err = 'Напишите, сколько взяли за аренду'; return render(); }
    S.busy = true; S.err = ''; render();
    // id создан при открытии окна: повтор после обрыва связи не создаст вторую аренду.
    api('rent', { tool: S.tool, days: +days, amount: Math.round(amount * 100) / 100, id: S.id }).then(function (r) {
      if (SHEET !== S) return;
      S.busy = false;
      if (take(r)) { SHEET = null; return render(); }
      S.err = r.error || 'Не получилось сохранить';
      if (!r.net) S.id = oid(); // сервер отказал — следующая попытка будет новой арендой
      render();
    });
  }
  function giveBack(id) {
    if (!id || RET[id]) return;
    if (!window.confirm('Инструмент вернули?')) return;
    RET[id] = true; render();
    api('return', { id: id }).then(function (r) {
      delete RET[id];
      if (!take(r) && !BAD) LOAD_ERR = r.error || 'Не получилось сохранить';
      render();
    });
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'ov') { if (e.target === b && SHEET && !SHEET.busy) { SHEET = null; render(); } return; }
    if (a === 'reload') { LOAD_ERR = ''; render(); return load(); }
    if (a === 'tool') {
      var t = D && D.tools && D.tools[+b.getAttribute('data-i')]; if (!t || !(num(t.free) > 0)) return;
      SHEET = { tool: t.name, days: '', sum: '', err: '', busy: false, id: oid() }; LOAD_ERR = ''; render();
      var f = document.getElementById('pk-days'); if (f) f.focus(); return;
    }
    if (a === 'close') { if (SHEET && !SHEET.busy) { SHEET = null; render(); } return; }
    if (a === 'rent') return rent();
    if (a === 'ret') return giveBack(b.getAttribute('data-id'));
  });
  app.addEventListener('input', function (e) {
    if (!SHEET) return;
    if (e.target.id === 'pk-days') SHEET.days = e.target.value;
    if (e.target.id === 'pk-sum') { SHEET.sum = e.target.value; var c = document.getElementById('pk-calc'); if (c) c.textContent = calcText(SHEET.sum); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && SHEET && !SHEET.busy) { SHEET = null; render(); } });

  if (!TOKEN) { BAD = 'Ссылка недействительна, позвоните Нурулло'; render(); } else load();
})();
</script>
</body>
</html>
